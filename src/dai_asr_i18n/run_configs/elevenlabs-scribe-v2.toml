# Executable inference run profile.
schema_version = 1
name = "elevenlabs-scribe-v2-v1"
channels = ["ch1", "ch2", "mono"]
sample_rate_hz = 16000

[model]
backend = "elevenlabs"
model_id = "scribe_v2"
environment = ["ELEVENLABS_API_KEY"]
transcribes = true
diarizes = true

[model.options]
diarize = true
timestamps_granularity = "word"
temperature = 0.0
seed = 0
tag_audio_events = true
