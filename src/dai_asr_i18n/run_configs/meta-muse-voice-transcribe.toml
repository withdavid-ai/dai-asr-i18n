# Executable inference run profile.
schema_version = 1
name = "meta-muse-voice-transcribe-1.0-v1"
channels = ["ch1", "ch2", "mono"]
sample_rate_hz = 16000

[model]
backend = "meta-muse"
model_id = "muse-voice-transcribe-1.0"
environment = ["MODEL_API_KEY"]
transcribes = true
diarizes = true

[model.options]
mode = "DIARIZATION"
audio_encoding = "WAV"
language_bias = true
max_input_s = 600.0
window_target_factor = 0.98
