# Executable inference run profile.
schema_version = 1
name = "mai-transcribe-2-v1"
channels = ["ch1", "ch2", "mono"]
sample_rate_hz = 16000

[model]
backend = "mai-transcribe"
model_id = "MAI-Transcribe-2"
environment = ["AZURE_SPEECH_KEY", "AZURE_SPEECH_ENDPOINT"]
transcribes = true
diarizes = true

[model.options]
api_version = "2025-10-15"
transcribe_style = "verbatim"
timestamps = "word"
