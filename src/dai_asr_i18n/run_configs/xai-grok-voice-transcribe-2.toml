# Executable inference run profile.
schema_version = 1
name = "xai-grok-voice-transcribe-2.0-v1"
channels = ["ch1", "ch2", "mono"]
sample_rate_hz = 16000

[model]
backend = "xai-grok"
model_id = "grok-voice-transcribe-2.0"
environment = ["XAI_API_KEY"]
transcribes = true
diarizes = true

[model.options]
diarize = true
format = false
filler_words = true
vad_threshold = 0.5
language_hint = true
