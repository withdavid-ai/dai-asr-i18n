# Executable inference run profile.
schema_version = 1
name = "nemotron-3-diarization-v1"
channels = ["mono"]
sample_rate_hz = 16000

[model]
backend = "nemo-sortformer"
model_id = "nvidia/Nemotron-3-Diarization"
revision = "f667ed73aee57d40cc39428eb768b4fd87a0a29e"
device = "cuda"
compute_type = "float32"
authenticated = false
environment = []
transcribes = false
diarizes = true

[model.options]
profile = "offline"
max_speakers = 8
batch_size = 1
postprocessing = "nemo_default"

[model.options.streaming]
spkcache_len = 264
fifo_len = 40
chunk_len = 340
chunk_left_context = 1
chunk_right_context = 40
spkcache_update_period = 300
