schema_version = 1
key = "meta_muse"
display_name = "Muse Voice Transcribe 1.0"
task = "asr_diarization"
execution = "hosted_api"
access = "proprietary"
provider = "Meta"
model_id = "muse-voice-transcribe-1.0"
reproducibility = "provider_managed"
language_policy = "explicit"
languages = ["en", "es", "ar", "fr", "de", "hi", "it", "ja", "ko", "pt", "tr", "vi", "zh", "id", "tl", "th", "bn", "mr", "te", "ta"]
channels = ["ch1", "ch2", "mono"]
transcribes = true
diarizes = true
credentials = ["META_API_KEY"]

[parameters]
endpoint = "https://api.meta.ai/v1/asr/transcribe"
mode = "DIARIZATION"
audio_encoding = "WAV"
sample_rate_hz = 24000
language_bias = true
max_input_s = 600.0
window_target_factor = 0.98
windowing = "audio_energy"
