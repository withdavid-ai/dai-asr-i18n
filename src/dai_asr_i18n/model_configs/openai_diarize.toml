schema_version = 1
key = "openai_diarize"
display_name = "gpt-4o-transcribe-diarize"
task = "asr_diarization"
execution = "hosted_api"
access = "proprietary"
provider = "OpenAI"
model_id = "gpt-4o-transcribe-diarize"
reproducibility = "provider_managed"
language_policy = "attempt_all"
languages = ["en", "es", "ar", "fr", "de", "hi", "it", "ja", "ko", "pt", "tr", "vi", "ru", "zh", "id", "tl", "th", "bn", "mr", "te", "ta"]
channels = ["ch1", "ch2", "mono"]
